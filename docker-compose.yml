services:
  nginx:
    container_name: booking_nginx
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./laravel:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - php
      - react
    networks:
      - booking_network

  php:
    container_name: booking_php
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    volumes:
      - ./laravel:/var/www/html
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=booking_db
      - DB_USERNAME=booking_user
      - DB_PASSWORD=booking_password
      - DB_CONNECTION=mysql
      - APP_NAME=BookingSystem
      - APP_ENV=local
    depends_on:
      - mysql
    networks:
      - booking_network

  react:
    container_name: booking_react
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./react:/app
      - react_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api
    networks:
      - booking_network

  mysql:
    container_name: booking_mysql
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: booking_db
      MYSQL_USER: booking_user
      MYSQL_PASSWORD: booking_password
      MYSQL_ALLOW_EMPTY_PASSWORD: 'no'
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - booking_network

volumes:
  mysql_data:
  react_node_modules:

networks:
  booking_network:
    driver: bridge
